name: Backend CI

# Manual only (owner's policy, 2026-11-23): CI never runs on push, pull request or a schedule.
# Start it from the Actions tab ("Run workflow") when asked or before a release.
on:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Run Ruff
        run: ruff check .
      - name: Run Black
        run: black --check .
      - name: Run pytest
        run: pytest
